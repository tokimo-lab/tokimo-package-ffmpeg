name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: stable
  TOKIMO_LIB_VERSION: v1.1.4
  FFMPEG_LINK_MODE: dynamic

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64 fmt + clippy + test
            runner: ubuntu-latest
            asset: tokimo-lib-linux-x86_64.tar.zst
          - name: macos aarch64 fmt + clippy + test
            runner: macos-latest
            asset: tokimo-lib-macos-aarch64.tar.zst
          - name: windows x86_64-gnu fmt + clippy + test
            runner: windows-latest
            asset: tokimo-lib-windows-x86_64.tar.zst

    steps:
      - uses: actions/checkout@v4

      - name: Install zstd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Install zstd (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Install zstd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
            choco install zstandard -y --no-progress
          }

      - name: Cache tokimo-lib native bundle
        id: tokimo_lib_cache
        uses: actions/cache@v4
        with:
          path: install
          key: tokimo-lib-${{ matrix.asset }}-${{ env.TOKIMO_LIB_VERSION }}

      - name: Download tokimo-lib native bundle
        if: steps.tokimo_lib_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf install
          mkdir -p install
          gh release download "${TOKIMO_LIB_VERSION}" \
            --repo tokimo-lab/tokimo-lib \
            --pattern "${{ matrix.asset }}" \
            --dir .
          zstd -dc "${{ matrix.asset }}" | tar -xf - -C install
          rm -f "${{ matrix.asset }}"

      - name: Verify native bundle layout
        shell: bash
        run: |
          set -euo pipefail
          test -d install/bin
          test -d install/lib
          test -d install/include
          ls -la install/bin install/lib install/include | head -80 || true

      - name: Set up Rust toolchain (Unix)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Rust toolchain (Windows GNU)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Install MinGW (Windows GNU linker)
        if: runner.os == 'Windows'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
          static: 0

      - name: Configure LLVM/clang for bindgen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvmBin\clang.exe")) {
            choco install llvm -y --no-progress
          }
          if (-not (Test-Path "$llvmBin\clang.exe")) {
            throw "clang.exe not found at $llvmBin"
          }
          $gccPath = (Get-Command gcc).Source
          $mingwRoot = Split-Path (Split-Path $gccPath -Parent) -Parent
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BINDGEN_EXTRA_CLANG_ARGS=--target=x86_64-w64-windows-gnu -I$mingwRoot\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (Unix)
        if: runner.os != 'Windows'
        env:
          FFMPEG_PKG_CONFIG_PATH: ${{ github.workspace }}/install/lib/pkgconfig
          FFMPEG_INCLUDE_DIR: ${{ github.workspace }}/install/include
          FFMPEG_LIBS_DIR: ${{ github.workspace }}/install/lib
          FFMPEG_LINK_MODE: dynamic
          LD_LIBRARY_PATH: ${{ github.workspace }}/install/lib
          DYLD_FALLBACK_LIBRARY_PATH: ${{ github.workspace }}/install/lib
          PKG_CONFIG_PATH: ${{ github.workspace }}/install/lib/pkgconfig
        run: cargo clippy --lib --bins --tests -- -D warnings

      - name: cargo test (Unix)
        if: runner.os != 'Windows'
        env:
          FFMPEG_PKG_CONFIG_PATH: ${{ github.workspace }}/install/lib/pkgconfig
          FFMPEG_INCLUDE_DIR: ${{ github.workspace }}/install/include
          FFMPEG_LIBS_DIR: ${{ github.workspace }}/install/lib
          FFMPEG_LINK_MODE: dynamic
          LD_LIBRARY_PATH: ${{ github.workspace }}/install/lib
          DYLD_FALLBACK_LIBRARY_PATH: ${{ github.workspace }}/install/lib
          PKG_CONFIG_PATH: ${{ github.workspace }}/install/lib/pkgconfig
        run: cargo test --lib --bins

      - name: cargo clippy and test (Windows GNU)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FFMPEG_PKG_CONFIG_PATH: ${{ github.workspace }}\install\lib\pkgconfig
          FFMPEG_INCLUDE_DIR: ${{ github.workspace }}\install\include
          FFMPEG_LIBS_DIR: ${{ github.workspace }}\install\lib
          FFMPEG_DLL_PATH: ${{ github.workspace }}\install\bin
          FFMPEG_LINK_MODE: dynamic
        run: |
          $env:PATH = "${{ github.workspace }}\install\bin;" + $env:PATH
          cargo clippy --target x86_64-pc-windows-gnu --lib --bins --tests -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --target x86_64-pc-windows-gnu --lib --bins
          exit $LASTEXITCODE
